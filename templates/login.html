<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SupportPilot | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            background:
                linear-gradient(
                    rgba(1, 7, 24, 0.35),
                    rgba(1, 7, 24, 0.65)
                ),
                url("{{ url_for('static', filename='supportpilot-bg.png') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .login-card {
            width: 430px;
            max-width: 92%;
            padding: 38px;

            border-radius: 22px;

            background: rgba(5, 20, 50, 0.92);

            border: 1px solid rgba(75, 165, 255, 0.45);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.60),
                0 0 40px rgba(35, 130, 255, 0.15);

            backdrop-filter: blur(15px);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .robot {
            width: 75px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    #18baff,
                    #6751ff
                );

            box-shadow:
                0 0 30px rgba(50, 150, 255, 0.55);
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
        }

        h1 span {
            color: #2cabff;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #b9cce8;
        }

        .message {
            display: none;

            margin-bottom: 18px;
            padding: 12px 14px;

            border-radius: 9px;

            font-size: 14px;
        }

        .message.error {
            display: block;

            background: rgba(255, 50, 80, 0.15);
            border: 1px solid rgba(255, 70, 100, 0.40);

            color: #ffdce2;
        }

        .message.success {
            display: block;

            background: rgba(20, 200, 120, 0.15);
            border: 1px solid rgba(30, 210, 130, 0.40);

            color: #d8ffec;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 15px;

            border-radius: 10px;
            border: 1px solid rgba(110, 165, 230, 0.40);

            outline: none;

            background: rgba(3, 15, 40, 0.88);
            color: white;

            font-size: 15px;
        }

        input::placeholder {
            color: #8197b8;
        }

        input:focus {
            border-color: #32aaff;

            box-shadow:
                0 0 0 3px rgba(40, 160, 255, 0.10);
        }

        #loginButton {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            color: white;

            font-size: 16px;
            font-weight: 700;

            background:
                linear-gradient(
                    90deg,
                    #16baff,
                    #2884ff,
                    #704cff
                );

            box-shadow:
                0 12px 30px rgba(40, 125, 255, 0.30);
        }

        #loginButton:hover {
            transform: translateY(-1px);
        }

        #loginButton:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .register {
            margin-top: 25px;

            text-align: center;

            font-size: 14px;

            color: #b9cce8;
        }

        .register a {
            display: block;

            margin-top: 12px;
            padding: 13px;

            border: 1px solid #35aaff;
            border-radius: 10px;

            color: #40b6ff;

            text-decoration: none;
            font-weight: 700;
        }

        .register a:hover {
            background: rgba(40, 150, 255, 0.15);
            color: white;
        }

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #40baff;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 2px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">

        <div class="robot">
            🤖
        </div>

        <h1>
            Support<span>Pilot</span>
        </h1>

        <p class="subtitle">
            AI-powered IT support ticket management
        </p>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>


    <div class="register">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </div>


    <div class="footer">
        FASTER • SMARTER • HAPPIER TEAMS
    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const form =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const messageBox =
        document.getElementById("message");


    function showMessage(text, type) {

        messageBox.textContent = text;

        messageBox.className =
            "message " + type;
    }


    function resetButton() {

        loginButton.disabled = false;

        loginButton.textContent =
            "Login";
    }


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Email and password are required.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        "/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            credentials:
                                "same-origin",

                            body:
                                JSON.stringify({
                                    email: email,
                                    password: password
                                })
                        }
                    );


                const rawResponse =
                    await response.text();


                console.log(
                    "LOGIN STATUS:",
                    response.status
                );

                console.log(
                    "LOGIN RESPONSE:",
                    rawResponse
                );


                let data;


                try {

                    data =
                        JSON.parse(rawResponse);

                } catch (error) {

                    throw new Error(
                        "Flask returned HTML instead of JSON."
                    );
                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Login failed."
                    );
                }


                if (data.success !== true) {

                    throw new Error(
                        data.message ||
                        "Login failed."
                    );
                }


                showMessage(
                    data.message ||
                    "Login successful.",
                    "success"
                );


                window.location.href =
                    data.redirect ||
                    "/dashboard";


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Login failed.",
                    "error"
                );


                resetButton();
            }

        }
    );

});
</script>

</body>
</html>
