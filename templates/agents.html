<div class="row g-3">

    <!-- Diagnosis -->
    <div class="col-xl col-md-6">
        <div class="agent-card">
            <div class="agent-icon">
                <i class="fa-solid fa-stethoscope"></i>
            </div>

            <h5>Diagnosis</h5>

            <div class="active-agent">
                ● Active
            </div>

            <div class="mt-3">
                <small class="text-muted">Confidence</small>
                <h4 id="agentDiagnosisScore">--%</h4>
            </div>
        </div>
    </div>


    <!-- Retrieval -->
    <div class="col-xl col-md-6">
        <div class="agent-card">
            <div class="agent-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <h5>Retrieval</h5>

            <div class="active-agent">
                ● Active
            </div>

            <div class="mt-3">
                <small class="text-muted">Similarity</small>
                <h4 id="agentRetrievalScore">--%</h4>
            </div>
        </div>
    </div>


    <!-- Resolution -->
    <div class="col-xl col-md-6">
        <div class="agent-card">
            <div class="agent-icon">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>

            <h5>Resolution</h5>

            <div class="active-agent">
                ● Active
            </div>

            <div class="mt-3">
                <small class="text-muted">Completeness</small>
                <h4 id="agentResolutionScore">--%</h4>
            </div>
        </div>
    </div>


    <!-- Validation -->
    <div class="col-xl col-md-6">
        <div class="agent-card">
            <div class="agent-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h5>Validation</h5>

            <div class="active-agent">
                ● Active
            </div>

            <div class="mt-3">
                <small class="text-muted">Final Confidence</small>
                <h4 id="agentValidationScore">--%</h4>
            </div>
        </div>
    </div>


    <!-- Escalation -->
    <div class="col-xl col-md-6">
        <div class="agent-card">
            <div class="agent-icon">
                <i class="fa-solid fa-arrow-up-right-dots"></i>
            </div>

            <h5>Escalation</h5>

            <div class="standby-agent">
                ● Standby
            </div>

            <div class="mt-3">
                <small class="text-muted">Decision</small>
                <h6 id="agentEscalationStatus">Waiting</h6>
            </div>
        </div>
    </div>

</div>
