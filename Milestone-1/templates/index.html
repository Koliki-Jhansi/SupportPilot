<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SupportPilot - Submit Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .sidebar {
            width: 215px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 25px 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: #e6f0ff;
            color: #2563eb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo h4 {
            margin: 0;
            color: #1f2937;
            font-weight: bold;
        }

        .logo small {
            color: #94a3b8;
            font-size: 12px;
        }

        .menu-item {
            display: block;
            text-decoration: none;
            color: #64748b;
            padding: 14px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .menu-item:hover {
            background: #f1f5f9;
            color: #2563eb;
        }

        .menu-item.active {
            background: #edf3ff;
            color: #2563eb;
            border-left: 3px solid #2563eb;
            font-weight: 600;
        }

        .bottom-user {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 15px;
            text-align: center;
            color: #64748b;
        }

        .bottom-user hr {
            border-color: #e5e7eb;
        }

        .main-content {
            margin-left: 215px;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            height: 65px;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
        }

        .content {
            padding: 25px;
        }

        .status-message {
            background: #e8f4ed;
            color: #166534;
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 15px;
            display: none;
        }

        .ticket-card {
            max-width: 720px;
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .ticket-card h5 {
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        .form-control,
        .form-select {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 11px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .submit-btn {
            background: #2563eb;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
        }

        .result-card {
            display: none;
            margin-top: 25px;
            border-radius: 14px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .result-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .result-box small {
            color: #64748b;
        }

        .result-box h5 {
            margin: 5px 0 0;
        }

        @media (max-width: 768px) {

            .sidebar {
                width: 70px;
            }

            .logo h4,
            .logo small,
            .menu-text,
            .bottom-user {
                display: none;
            }

            .main-content {
                margin-left: 70px;
            }

            .menu-item {
                text-align: center;
            }

        }

    </style>

</head>


<body>


<div class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            🎧
        </div>

        <div>
            <h4>SupportPilot</h4>
            <small>IT Ticket Desk</small>
        </div>

    </div>


    <a href="/dashboard" class="menu-item">
        📊 <span class="menu-text">Dashboard</span>
    </a>

    <a href="/" class="menu-item active">
        ➕ <span class="menu-text">Submit Ticket</span>
    </a>

    <a href="/dashboard" class="menu-item">
        📁 <span class="menu-text">All Tickets</span>
    </a>

    <a href="/severity-guide" class="menu-item">
    📈 <span class="menu-text">Severity Guide</span>
</a>

    <a href="/api/tickets" class="menu-item">
        ⚑ <span class="menu-text">API Info</span>
    </a>


    <div class="bottom-user">

        <hr>

        <p class="mb-2">Support User</p>

        <button class="btn btn-link text-danger text-decoration-none">
            Logout
        </button>

    </div>

</div>


<div class="main-content">


    <div class="topbar">
        Submit Ticket
    </div>


    <div class="content">


        <div id="statusMessage" class="status-message"></div>


        <div class="ticket-card">

            <h5>Submit a Ticket</h5>


            <form id="ticketForm">


                <div class="mb-3">

                    <label class="form-label">
                        Employee Name
                    </label>

                    <input
                        type="text"
                        name="employee_name"
                        class="form-control"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        name="department"
                        class="form-control"
                        placeholder="Engineering"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Ticket Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Short summary"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"
                        placeholder="Describe the issue in detail..."
                        required
                    ></textarea>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Business Impact
                    </label>

                    <select class="form-select">

                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                        <option>Critical</option>

                    </select>

                </div>


                <button
                    type="submit"
                    id="submitButton"
                    class="btn btn-primary submit-btn w-100"
                >
                    🤖 Submit & Analyze
                </button>


            </form>


            <div id="resultCard" class="result-card">

                <h5>🤖 AI Classification Result</h5>

                <div class="result-grid">

                    <div class="result-box">

                        <small>Category</small>

                        <h5 id="categoryResult"></h5>

                    </div>


                    <div class="result-box">

                        <small>Severity</small>

                        <h5 id="severityResult"></h5>

                    </div>


                    <div class="result-box">

                        <small>Priority</small>

                        <h5 id="priorityResult"></h5>

                    </div>


                    <div class="result-box">

                        <small>Confidence</small>

                        <h5 id="confidenceResult"></h5>

                    </div>

                </div>

            </div>


        </div>


    </div>

</div>


<script>

const form = document.getElementById("ticketForm");

const button = document.getElementById("submitButton");

const statusMessage =
    document.getElementById("statusMessage");

const resultCard =
    document.getElementById("resultCard");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        button.disabled = true;

        button.innerHTML =
            "🤖 AI is analyzing ticket...";


        const formData =
            new FormData(form);


        try {

            const response =
                await fetch(
                    "/submit-ticket",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                document.getElementById(
                    "categoryResult"
                ).textContent =
                    data.result.category;


                document.getElementById(
                    "severityResult"
                ).textContent =
                    data.result.severity;


                document.getElementById(
                    "priorityResult"
                ).textContent =
                    data.result.priority;


                document.getElementById(
                    "confidenceResult"
                ).textContent =
                    data.result.confidence + "%";


                resultCard.style.display =
                    "block";


                statusMessage.style.display =
                    "block";


                statusMessage.innerHTML =
                    "✓ Ticket submitted successfully — " +
                    "Category: " +
                    data.result.category +
                    ", Severity: " +
                    data.result.severity +
                    ", Priority: " +
                    data.result.priority;


                form.reset();

            }

            else {

                alert(data.message);

            }

        }

        catch(error) {

            alert(
                "Unable to connect to server."
            );

        }


        button.disabled = false;

        button.innerHTML =
            "🤖 Submit & Analyze";

    }
);

</script>


</body>

</html>
